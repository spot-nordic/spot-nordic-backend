<title>Fyrsta lifandi prentauglýsingin á Íslandi birtist í Fréttablaðinu í dag. 

Við unnum þessa auglýsingu í samstarfi við snillingana hjá RVX fyrir Happdrætti Háskóla Íslands og byggir hún á samspili prents og viðbótar veruleika (e. augmented reality).

Með því að skanna inn QR-kóða með myndavélinni á símanum opnast linkur innan Facebookappsins. Þá þarf að ramma inn auglýsinguna og ýta á afspilunartakkann sem glæðir auglýsinguna lífi.
